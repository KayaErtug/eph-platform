name: EPH QA Fix Muteahhit Drawer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eph-qa-fix-muteahhit-drawer.yml

permissions:
  contents: write

jobs:
  fix-muteahhit-drawer:
    name: EPH Muteahhit Drawer Locator Duzeltmesi
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Muteahhit menu locatorlarini drawer icine sabitle
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('e2e/tests/muteahhit-auth.spec.ts')
          text = path.read_text(encoding='utf-8')

          anchor = "  await expect(closeButton).toBeVisible({ timeout: 5000 });\n"
          drawer_block = (
              "  await expect(closeButton).toBeVisible({ timeout: 5000 });\n\n"
              "  const drawer = page.locator('.eph-mobile-menu-drawer');\n"
              "  await expect(drawer).toBeVisible();\n"
          )

          if "const drawer = page.locator('.eph-mobile-menu-drawer');" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'HATA: Drawer ekleme noktasi bulunamadi: {text.count(anchor)}')
              text = text.replace(anchor, drawer_block, 1)

          replacements = {
              "page.getByText('Müteahhit', { exact: true })": "drawer.getByText('Müteahhit', { exact: true })",
              "page.getByText('Proje Satış Merkezi', { exact: true })": "drawer.getByText('Proje Satış Merkezi', { exact: true })",
              "page.getByText('Duyurular', { exact: true })": "drawer.getByText('Duyurular', { exact: true })",
              "page.getByText('Referans Kodları', { exact: true })": "drawer.getByText('Referans Kodları', { exact: true })",
              "page.getByText(label, { exact: true }).first()": "drawer.getByText(label, { exact: true }).first()",
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)

          required = [
              "const drawer = page.locator('.eph-mobile-menu-drawer');",
              "drawer.getByText('Müteahhit', { exact: true })",
              "drawer.getByText('Proje Satış Merkezi', { exact: true })",
              "drawer.getByText(label, { exact: true }).first()",
          ]

          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('HATA: Drawer locator duzeltmesi eksik: ' + ' | '.join(missing))

          path.write_text(text, encoding='utf-8')
          print('OK: Muteahhit menu locatorlari drawer icine sabitlendi.')
          PY

      - name: Degisikligi kontrol et
        run: |
          git diff --check
          git diff -- e2e/tests/muteahhit-auth.spec.ts

      - name: Duzeltmeyi main dalina kaydet
        run: |
          if git diff --quiet -- e2e/tests/muteahhit-auth.spec.ts; then
            echo "Düzeltme zaten mevcut."
            exit 0
          fi

          git config user.name "EPH QA Automation"
          git config user.email "149750282+KayaErtug@users.noreply.github.com"
          git add e2e/tests/muteahhit-auth.spec.ts
          git commit -m "test: scope muteahhit menu assertions to drawer"
          git push origin HEAD:main
