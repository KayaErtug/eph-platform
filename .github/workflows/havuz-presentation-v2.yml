name: Havuz Presentation V2 Rollout

on:
  push:
    branches:
      - feature/havuz-musteri-sunumu-v2
    paths:
      - tools/havuz-presentation-v2/apply.mjs

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/havuz-musteri-sunumu-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted source updates
        run: node tools/havuz-presentation-v2/apply.mjs
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit validated updates
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "EPH Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend
          git commit -m "feat: complete havuz customer presentation v2"
          git push origin HEAD:feature/havuz-musteri-sunumu-v2
