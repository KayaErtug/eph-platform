name: EPH Playwright Emlakci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eph-playwright-emlakci.yml
      - e2e/tests/emlakci-auth.spec.ts
      - e2e/tests/emlakci-3d-access.spec.ts
      - e2e/package.json
      - e2e/playwright.config.ts

permissions:
  contents: read

jobs:
  emlakci:
    name: EPH Emlakci Live Journey
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: e2e

    env:
      EPH_BASE_URL: https://emlakportfoyhavuzu.com
      EPH_TEST_EMLAKCI_EMAIL: umaykutay@gmail.com
      EPH_TEST_EMLAKCI_PASSWORD: ${{ secrets.EPH_TEST_EMLAKCI_PASSWORD }}
      CI: 'true'

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Emlakci test secret kontrolu
        run: |
          if [ -z "$EPH_TEST_EMLAKCI_PASSWORD" ]; then
            echo "::error::EPH_TEST_EMLAKCI_PASSWORD GitHub Actions Secret olarak tanimlanmalidir."
            exit 2
          fi

      - name: Node.js 22 kur
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test bagimliliklarini kur
        run: npm install --no-audit --no-fund

      - name: Chromium ve sistem bagimliliklarini kur
        run: npx playwright install --with-deps chromium

      - name: Emlakci canli yolculuk ve 3D yetki testlerini calistir
        run: npx playwright test tests/emlakci-auth.spec.ts tests/emlakci-3d-access.spec.ts --trace=off

      - name: Playwright raporunu yukle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eph-playwright-emlakci-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 1
