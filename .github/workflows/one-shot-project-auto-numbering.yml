name: One-shot Project Auto Numbering

on:
  push:
    branches:
      - feature/project-auto-numbering
    paths:
      - .github/workflows/one-shot-project-auto-numbering.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.event_name == 'push' || github.head_ref == 'feature/project-auto-numbering'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/project-auto-numbering
          fetch-depth: 0

      - name: Apply project numbering patch
        run: python3 scripts/apply-project-auto-numbering.py

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eph
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eph
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit implementation and remove one-shot files
        run: |
          git config user.name "EPH Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-project-auto-numbering.yml
          git rm scripts/apply-project-auto-numbering.py
          git add backend/src/project-sales/project-sales-inventory.service.ts
          git add frontend/src/app/proje-satis-sablonu/page.tsx
          git add frontend/src/app/proje-satis-sablonu/lib/projectSalesTypes.ts
          git commit -m "feat: add automatic project unit numbering modes"
          git push origin HEAD:feature/project-auto-numbering
