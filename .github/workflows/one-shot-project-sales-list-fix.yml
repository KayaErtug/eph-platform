name: One-shot Project Sales List Fix

on:
  push:
    branches:
      - fix/project-sales-list-scope
    paths:
      - .github/workflows/one-shot-project-sales-list-fix.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/project-sales-list-scope
          fetch-depth: 0

      - name: Restrict project sales list
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/src/project-sales/project-sales-setup.service.ts')
          text = path.read_text(encoding='utf-8-sig')

          old = '''  async listProjectDrafts(userId: string, userRole: Role) {
    return this.prisma.project.findMany({
      where:
        userRole === Role.SUPER_ADMIN
          ? {}
          : {
              ownerId: userId,
            },
      select: this.projectListSelect(),
      orderBy: [{ isActive: 'desc' }, { updatedAt: 'desc' }],
    });
  }
'''

          new = '''  async listProjectDrafts(userId: string, userRole: Role) {
    return this.prisma.project.findMany({
      where: {
        code: {
          not: null,
        },
        ...(userRole === Role.SUPER_ADMIN
          ? {}
          : {
              ownerId: userId,
            }),
      },
      select: this.projectListSelect(),
      orderBy: [{ isActive: 'desc' }, { updatedAt: 'desc' }],
    });
  }
'''

          if old not in text:
              raise SystemExit('listProjectDrafts block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eph
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eph
        run: npm run build

      - name: Commit hotfix and remove workflow
        shell: bash
        run: |
          git config user.name "EPH Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-project-sales-list-fix.yml
          git add backend/src/project-sales/project-sales-setup.service.ts
          git commit -m "fix: separate project sales drafts from portfolio projects"
          git push origin HEAD:fix/project-sales-list-scope
