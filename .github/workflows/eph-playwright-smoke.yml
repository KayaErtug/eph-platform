name: EPH Playwright Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - .github/workflows/eph-playwright-smoke.yml
      - e2e/tests/smoke.spec.ts
      - e2e/package.json
      - e2e/playwright.config.ts
      - frontend/src/components/EPHMobileShell.tsx
      - frontend/src/proxy.ts
      - frontend/src/app/giris/**
      - frontend/src/app/kayit/**
      - frontend/src/app/sifremi-unuttum/**
      - frontend/src/app/proje-sunum/**
      - frontend/src/app/portfoy-paylasim/**
      - frontend/src/app/paylasim/**
      - frontend/src/app/talep-paylasim/**

permissions:
  contents: read

jobs:
  smoke:
    name: EPH Live Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: e2e

    env:
      EPH_BASE_URL: https://emlakportfoyhavuzu.com
      CI: 'true'

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Node.js 22 kur
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test bağımlılıklarını kur
        run: npm install --no-audit --no-fund

      - name: Chromium ve sistem bağımlılıklarını kur
        run: npx playwright install --with-deps chromium

      - name: EPH smoke testlerini çalıştır
        run: npm run test:smoke

      - name: Playwright raporunu yükle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eph-playwright-smoke-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
