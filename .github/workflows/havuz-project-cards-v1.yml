name: Havuz Project Cards V1 Apply

on:
  push:
    branches:
      - feature/havuz-project-cards-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/havuz-project-cards-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply integration patches
        run: node tools/havuz-project-cards-v1/apply.mjs

      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/pool-experience/pool-experience.service.ts backend/src/pool-projects/pool-projects.service.ts frontend/src/app/havuz/page.tsx
          git commit -m "feat: integrate grouped project cards into Havuz"
          git push origin HEAD:feature/havuz-project-cards-v1
