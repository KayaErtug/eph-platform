name: EPH Frontend Build

# Kalıcı production build kapısı: frontend QA düzeltmelerini main üzerinde doğrular.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eph-frontend-build.yml
      - frontend/src/**
      - frontend/public/**
      - frontend/next.config.ts
      - frontend/package.json
      - frontend/package-lock.json

permissions:
  contents: read

jobs:
  frontend-build:
    name: EPH Next.js Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: https://emlakportfoyhavuzu.com/api

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Node.js 22 kur
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bagimliliklarini kur
        run: npm ci --no-audit --no-fund

      - name: Next.js production build
        run: npm run build
