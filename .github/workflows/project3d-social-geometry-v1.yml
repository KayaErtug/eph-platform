name: Project3D Social Geometry V1

on:
  push:
    branches:
      - feature/project3d-social-geometry-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    if: github.event_name == 'push' || github.head_ref == 'feature/project3d-social-geometry-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/project3d-social-geometry-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Apply social geometry package
        run: |
          python3 .github/scripts/add_project_space_gate_enum.py
          python3 .github/scripts/apply_project3d_social_geometry_v1.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Remove temporary rollout files
        run: |
          rm -f .github/scripts/add_project_space_gate_enum.py
          rm -f .github/scripts/apply_project3d_social_geometry_v1.py
          rm -f .github/workflows/project3d-social-geometry-v1.yml

      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: add Project3D realistic amenity geometry"
          git push origin HEAD:feature/project3d-social-geometry-v1
