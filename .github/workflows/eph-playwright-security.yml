name: EPH Playwright Security Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eph-playwright-security.yml
      - e2e/tests/security-role-matrix.spec.ts
      - e2e/package.json
      - e2e/playwright.config.ts

permissions:
  contents: read

jobs:
  security:
    name: EPH Role Security Privacy Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: e2e

    env:
      EPH_BASE_URL: https://emlakportfoyhavuzu.com
      EPH_TEST_EMLAKCI_EMAIL: umaykutay@gmail.com
      EPH_TEST_EMLAKCI_PASSWORD: ${{ secrets.EPH_TEST_EMLAKCI_PASSWORD }}
      EPH_TEST_MUTEAHHIT_EMAIL: jingchensh36@gmail.com
      EPH_TEST_MUTEAHHIT_PASSWORD: ${{ secrets.EPH_TEST_MUTEAHHIT_PASSWORD }}
      CI: 'true'

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Test secret kontrolu
        run: |
          if [ -z "$EPH_TEST_EMLAKCI_PASSWORD" ] || [ -z "$EPH_TEST_MUTEAHHIT_PASSWORD" ]; then
            echo "::error::Emlakci veya Muteahhit test secret bilgisi eksik."
            exit 2
          fi

      - name: Node.js 22 kur
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test bagimliliklarini kur
        run: npm install --no-audit --no-fund

      - name: Chromium ve sistem bagimliliklarini kur
        run: npx playwright install --with-deps chromium

      - name: Rol yetki ve mahremiyet testlerini calistir
        run: npx playwright test tests/security-role-matrix.spec.ts --trace=off

      - name: Playwright raporunu yukle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eph-playwright-security-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 2
