name: EPH QA Fix Registration Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eph-qa-fix-registration-label.yml

permissions:
  contents: write

jobs:
  fix-registration-labels:
    name: EPH Kayit Erisilebilirlik Duzeltmesi
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Kayit secim alanlarini erisilebilir adla iliskilendir
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('frontend/src/app/kayit/page.tsx')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          membership_found = 0
          city_found = 0
          output = []

          for index, line in enumerate(lines):
              output.append(line)

              if line.strip() != '<select':
                  continue

              next_line = lines[index + 1].strip() if index + 1 < len(lines) else ''
              indent = line[: len(line) - len(line.lstrip())] + '  '

              if next_line == 'value={selectedRegistrationType || ""}':
                  membership_found += 1
                  if index + 1 < len(lines) and 'aria-label="Üyelik Türü"' not in lines[index + 1]:
                      output.append(f'{indent}aria-label="Üyelik Türü"\n')

              if next_line == '{...register("city")}':
                  city_found += 1
                  if index + 1 < len(lines) and 'aria-label="Şehir"' not in lines[index + 1]:
                      output.append(f'{indent}aria-label="Şehir"\n')

          if membership_found != 1:
              raise SystemExit(
                  f'HATA: Üyelik Türü select hedefi beklenen sayıda bulunamadı: {membership_found}'
              )

          if city_found != 1:
              raise SystemExit(
                  f'HATA: Şehir select hedefi beklenen sayıda bulunamadı: {city_found}'
              )

          text = ''.join(output)

          if text.count('aria-label="Üyelik Türü"') != 1:
              raise SystemExit('HATA: Üyelik Türü aria-label doğrulanamadı.')
          if text.count('aria-label="Şehir"') != 1:
              raise SystemExit('HATA: Şehir aria-label doğrulanamadı.')

          path.write_text(text, encoding='utf-8')
          print('OK: Üyelik Türü ve Şehir seçimleri erişilebilir ad aldı.')
          PY

      - name: Degisikligi kontrol et
        run: |
          git diff --check
          git diff -- frontend/src/app/kayit/page.tsx

      - name: Duzeltmeyi main dalina kaydet
        run: |
          if git diff --quiet -- frontend/src/app/kayit/page.tsx; then
            echo "Düzeltme zaten mevcut."
            exit 0
          fi

          git config user.name "EPH QA Automation"
          git config user.email "149750282+KayaErtug@users.noreply.github.com"
          git add frontend/src/app/kayit/page.tsx
          git commit -m "fix: label registration select fields for accessibility"
          git push origin HEAD:main
