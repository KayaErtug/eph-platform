name: Project Blocks Accordion V1 Rollout

on:
  push:
    branches:
      - feature/project-blocks-accordion-v1
    paths:
      - .github/scripts/apply_project_blocks_accordion_v1.py
      - .github/workflows/project-blocks-accordion-v1-rollout.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/project-blocks-accordion-v1
          fetch-depth: 0

      - name: Apply accordion patch
        run: python3 .github/scripts/apply_project_blocks_accordion_v1.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/proje-satis-sablonu/page.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: blok kartlarını akordeon görünümüne geçir"
            git push origin HEAD:feature/project-blocks-accordion-v1
          fi
