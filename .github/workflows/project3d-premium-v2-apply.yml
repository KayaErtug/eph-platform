name: Project3D Premium V2 Apply

on:
  push:
    branches:
      - feature/project3d-premium-geometry-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project3d-premium-geometry-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Project3D premium V2 patches
        run: node tools/project3d-premium-v2/apply.mjs

      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/proje-satis-sablonu/3d/[projectId]/Project3DStudioClient.tsx backend/src/project-scene/project-scene.service.ts
          git commit -m "feat: upgrade Project3D to premium closed-volume geometry"
          git push origin HEAD:feature/project3d-premium-geometry-v2
