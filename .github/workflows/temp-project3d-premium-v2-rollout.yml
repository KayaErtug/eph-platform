name: Temporary Project3D Premium V2 Rollout

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[EPH] Apply Project3D Premium V2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project3d-premium-geometry-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply premium geometry patches
        run: node tools/project3d-premium-v2/apply.mjs

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add frontend/src/app/proje-satis-sablonu/3d/[projectId]/Project3DStudioClient.tsx backend/src/project-scene/project-scene.service.ts
            git commit -m "feat: upgrade Project3D to premium closed-volume geometry"
            git push origin HEAD:feature/project3d-premium-geometry-v2
          fi

      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
